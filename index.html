h1{font-size:clamp(30px,7vw,50px);line-height:1.05;margin:8px 0 12px;letter-spacing:-1.8px}.hero p{color:var(--muted);font-size:17px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 5px 18px #11111108;margin-bottom:12px}.btn{padding:13px 16px;border-radius:12px;font-weight:900;display:inline-block;text-align:center}.primary{background:var(--red);color:#fff}.success{background:var(--green);color:#fff}.outline{background:#fff;border:1px solid var(--line);color:var(--ink)}.danger{background:#fff0f0;color:#b42318}.blue{background:#2563eb;color:#fff}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.small{font-size:13px;color:var(--muted)}.title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 12px}.title h2{margin:0}
label{display:block;font-size:13px;font-weight:800;margin:12px 0 6px}input,select,textarea{width:100%;padding:12px;border:1px solid #d7dce3;border-radius:11px;background:#fff;outline:none}input:focus,select:focus,textarea:focus{border-color:#e57373;box-shadow:0 0 0 3px #c6282814}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 14px}.full{grid-column:1/-1}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:900;background:#edf7f0;color:var(--green)}.badge.red{background:#fff0f0;color:var(--red)}.badge.blue{background:#eff6ff;color:#2563eb}
.donor{display:flex;gap:14px;align-items:center}.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#fff0f0;font-weight:900;color:var(--red);flex:none}.grow{flex:1}.distance{font-weight:900}.list{display:grid;gap:12px}.stat{font-size:28px;font-weight:900}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding:8px;z-index:30}.nav button{background:transparent;padding:8px 10px;border-radius:10px;color:var(--muted);font-size:12px}.nav button.active{background:#fff0f0;color:var(--red);font-weight:900}
.toast{position:fixed;right:16px;bottom:76px;background:#18212b;color:#fff;padding:12px 15px;border-radius:12px;display:none;z-index:50;max-width:330px}.toast.show{display:block}.hidden{display:none!important}.permission{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.permission:last-child{border-bottom:0}.permission .state{font-size:12px;font-weight:800}.videoBox{width:100%;max-width:420px;border-radius:16px;background:#111;display:block;margin:12px auto;min-height:220px}.ok{color:var(--green)}.bad{color:var(--red)}
.notice{padding:13px 15px;border-radius:13px;background:#fff9e8;border:1px solid #f4df9d;color:#7a5b00}.live{padding:13px 15px;border-radius:13px;background:#effaf3;border:1px solid #bfe6ca;color:#126235}
.request{border-left:4px solid var(--red)}.urgent{animation:pulse 2.5s infinite}@keyframes pulse{50%{box-shadow:inset 0 0 0 3px #c6282810,0 8px 24px #c6282812}}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.step{padding:10px;border-radius:12px;background:#f4f5f7;text-align:center;font-size:12px}.step.on{background:#fff0f0;color:var(--red);font-weight:900}
@media(max-width:650px){.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.hero{padding:22px}.nav{justify-content:space-around}.nav button{padding:8px 5px}.hero .actions .btn{flex:1;min-width:145px}}
</style>

// ==================== LOCATION DATA & CASCADING ====================
// Real cascading location data:
// State -> District (latest government-sourced dataset)
// Location data used by the form: State -> District only.
// Matching uses State + District; manual address remains free text.
const states=[
 "Andhra Pradesh","Arunachal Pradesh","Assam","Bihar","Chhattisgarh","Goa","Gujarat",
 "Haryana","Himachal Pradesh","Jharkhand","Karnataka","Kerala","Madhya Pradesh",
 "Maharashtra","Manipur","Meghalaya","Mizoram","Nagaland","Odisha","Punjab","Rajasthan",
 "Sikkim","Tamil Nadu","Telangana","Tripura","Uttar Pradesh","Uttarakhand","West Bengal",
 "Andaman and Nicobar Islands","Chandigarh","Dadra and Nagar Haveli and Daman and Diu","Delhi",
 "Jammu and Kashmir","Ladakh","Lakshadweep","Puducherry"
];

const locationCache={districts:{}};
const PINCODE_API="https://aniket-thapa.github.io/india-pincode-api";

const uniqueList=a=>[...new Set((a||[]).map(x=>String(x??"").trim()).filter(Boolean))];
const norm=x=>String(x||"").trim().toLowerCase().replace(/[._-]+/g," ").replace(/\s+/g," ");
const safeLocation=x=>String(x??"").replace(/[&<>\"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const slugify=x=>String(x||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/&/g," and ").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");

function setOptions(el,items,placeholder,disabled=false){
 if(!el)return;
 const vals=uniqueList(items);
 el.innerHTML=`<option value="">${safeLocation(placeholder)}</option>`+vals.map(x=>`<option value="${safeLocation(x)}">${safeLocation(x)}</option>`).join("");
 el.disabled=!!disabled;
}

async function apiJSON(url){const r=await fetch(url,{cache:"no-store",mode:"cors"});if(!r.ok)throw new Error("HTTP "+r.status);return await r.json();}

async function loadDistrict(s,d){
 const st=document.getElementById(s)?.value||"";
 const el=document.getElementById(d); if(!el)return [];
 if(!st){setOptions(el,[],"All District",true);return []}
 el.disabled=true; el.innerHTML='<option value="">Loading districts…</option>';
 let names=[];
 try{
   const data=await apiJSON(`${PINCODE_API}/states/${slugify(st)}.json`);
   names=uniqueList((data.districts||[]).map(x=>typeof x==="string"?x:x.name));
 }catch(e){
   const local=INDIA_DATA[st]?.districts||{};
   names=uniqueList(Object.keys(local));
 }
 names.sort((a,b)=>a.localeCompare(b));
 setOptions(el,names,"All District",!names.length);
 if(!names.length)el.innerHTML='<option value="">No district data available</option>';
 return names;
}

async function locationChanged(s,d,_unused,kind){
 if(kind==="state"){
   const de=document.getElementById(d);
   if(de)de.value="";
   await loadDistrict(s,d);
 }
}



let state={page:"home",user:null,request:null,results:[],firebaseReady:configured,permissionsGranted:false};

function toast(x){const t=document.getElementById("toast");t.textContent=x;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),3000)}
function bloodOptions(selected="B+"){return ["A+","A-","B+","B-","AB+","AB-","O+","O-"].map(x=>`<option ${x===selected?"selected":""}>${x}</option>`).join("")}
function safe(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function normalizeMobile(x){return String(x||"").replace(/\D/g,"")}
function loginEmail(mobile){return normalizeMobile(mobile)+"@jeevansetu-demo.invalid"}

function appShell(){document.getElementById("app").innerHTML=`
<header class="appbar"><div class="brand"><span class="drop">🩸</span> JeevanSetu</div>
<button class="btn outline" onclick="go('profile')">☰</button></header>
<main class="wrap"><div id="view"></div></main>${nav()}`;render()}
function nav(){return `<nav class="nav"><button onclick="go('home')">🏠<br>Home</button><button onclick="go('find')">🩸<br>Find Blood</button><button onclick="go('donor')">❤️<br>Donor</button><button onclick="go('requests')">📋<br>Requests</button><button onclick="go('profile')">👤<br>Profile</button></nav>`}
window.go=function(p){if(!state.permissionsGranted && p!=="permissions"){toast("Please Allow all required permissions first.");return}state.page=p;render();scrollTo({top:0,behavior:"smooth"})}

function render(){
 const v=document.getElementById("view"); if(!v)return;
 const p=state.page;
 v.innerHTML=p==="home"?home():p==="register"?register():p==="login"?login():p==="find"?find():p==="results"?results():p==="emergency"?emergency():p==="donor"?donor():p==="requestdetail"?requestdetail():p==="requests"?requests():p==="profile"?profile():p==="connections"?connections():p==="permissions"?permissions():p==="scan"?scan():about();
 if(["register","find","emergency"].includes(p)) setTimeout(refreshLocationForms,0);
 if(p==="permissions") setTimeout(refreshPermissionStatus,50);
 if(p!=="scan") stopQRScan();
}

<h1>Find blood.<br>Connect fast.<br>Help each other.</h1>
<p>JeevanSetu is designed around one simple idea: register once, so that in an emergency you can request matching blood—and when you are able to donate, help another registered person.</p>
<div class="actions"><button class="btn primary" onclick="go('find')">🔎 FIND BLOOD</button><button class="btn success" onclick="go('register')">🩸 REGISTER</button></div></section>

<div class="steps"><div class="step on">1<br>Register</div><div class="step">2<br>Request</div><div class="step">3<br>Donor receives</div><div class="step">4<br>Accept → Contact</div></div>
<div class="title"><h2>Safety & Permissions</h2></div><div class="card"><p class="small">JeevanSetu requires all listed device permissions before the app can be used. If you choose <b>Deny</b>, you will remain on this permission screen until you Allow them.</p><div class="actions"><button class="btn outline" onclick="go('permissions')">🔐 CHECK PERMISSIONS</button><button class="btn outline" onclick="go('scan')">📷 SCAN QR</button></div></div>

function register(){return `<div class="title"><h2>Create JeevanSetu account</h2><span class="badge">Required</span></div><div class="card"><p class="small">Register once. The same account can request blood during an emergency and can be listed as an available donor when you are able to donate.</p>
<div class="full"><label>Start as *</label><div class="actions" style="margin-top:4px"><label style="display:flex;gap:8px;align-items:center;margin:0"><input type="radio" name="purpose" id="purposeDonor" value="donor" checked style="width:auto"> 🩸 Register as Donor</label><label style="display:flex;gap:8px;align-items:center;margin:0"><input type="radio" name="purpose" id="purposeReceiver" value="receiver" style="width:auto"> 🏥 Register as Receiver</label></div><p class="small">This is only your starting dashboard. The same account can later switch between Donor and Receiver.</p></div><div><label>Full name *</label><input id="rname" placeholder="Your full name"></div>
<div><label>Date of birth</label><input id="rdob" type="date"></div>
<div><label>Mobile number *</label><input id="rmobile" inputmode="numeric" maxlength="10" placeholder="10-digit mobile"></div>
<div><label>Email (optional)</label><input id="remail" type="email" placeholder="you@example.com"></div>
<div><label>Blood group *</label><select id="rblood">${bloodOptions()}</select></div>
<div><label>State *</label><select id="rstate" onchange="locationChanged('rstate','rdistrict',null,'state')"><option value="">All State</option>${states.map(x=>`<option value="${safe(x)}">${safe(x)}</option>`).join("")}</select></div>
<div><label>District *</label><select id="rdistrict" onchange="locationChanged('rstate','rdistrict',null,'district')"><option value="">All District</option></select></div>

<div class="full"><label>Address</label><textarea id="raddress" rows="2" placeholder="Avoid entering unnecessary sensitive details"></textarea></div>
<div><label>Password *</label><input id="rpass" type="password" placeholder="At least 6 characters"></div>
<div><label>Confirm password *</label><input id="rpass2" type="password"></div>
<div class="full"><label><input id="ravail" type="checkbox" checked style="width:auto"> I can be shown as available for emergency donation requests when I am able to donate.</label></div></div>
<button class="btn success" onclick="registerUser()">CREATE ACCOUNT</button></div>
<p class="small">Already registered? <button class="btn outline" onclick="go('login')">Login</button></p>`}

window.registerUser=async function(){
 if(!state.firebaseReady)return toast("First add your Firebase configuration.");
 const g=id=>document.getElementById(id).value.trim();
 const mobile=normalizeMobile(g("rmobile"));
 if(!g("rname")||mobile.length!==10||!g("rpass")||!g("rblood")||!g("rstate")||!g("rdistrict"))return toast("Name, mobile, password, blood group, state and district are required.");
 if(g("rpass").length<6)return toast("Password must be at least 6 characters.");
 if(g("rpass")!==g("rpass2"))return toast("Passwords do not match.");
 try{
  const cred=await createUserWithEmailAndPassword(auth,loginEmail(mobile),g("rpass"));
  const purpose=document.querySelector("input[name=purpose]:checked")?.value||"donor"; const user={uid:cred.user.uid,name:g("rname"),dob:g("rdob"),mobile,email:g("remail"),blood:g("rblood"),state:g("rstate"),district:g("rdistrict"),address:g("raddress"),available:document.getElementById("ravail").checked,activeRole:purpose,createdAt:serverTimestamp()};
  await setDoc(doc(db,"users",cred.user.uid),user);
  state.user=user; toast("Account created"); go("profile");
 }catch(e){toast(e.code==="auth/email-already-in-use"?"This mobile is already registered. Please login.":e.message)}
}

function login(){return `<div class="title"><h2>Login</h2></div><div class="card"><label>Mobile number *</label><input id="lmobile" inputmode="numeric" maxlength="10" placeholder="Registered 10-digit mobile"><label>Password *</label><input id="lpass" type="password" placeholder="Password"><div class="actions"><button class="btn primary" onclick="loginUser()">LOGIN</button><button class="btn outline" onclick="go('register')">REGISTER</button></div></div>`}
window.loginUser=async function(){
 if(!state.firebaseReady)return toast("First add your Firebase configuration.");
 const mobile=normalizeMobile(document.getElementById("lmobile").value), pass=document.getElementById("lpass").value;
 if(mobile.length!==10||!pass)return toast("Enter registered mobile and password.");
 try{await signInWithEmailAndPassword(auth,loginEmail(mobile),pass);toast("Login successful");go("profile")}
 catch(e){toast("Login details are incorrect or account is not registered.")}
}

function find(){
 if(!state.user)return `<div class="title"><h2>Emergency Blood Help</h2><span class="badge red">Registration required</span></div><div class="card"><h3>🛡️ Register before requesting</h3><p class="small">JeevanSetu is a community network. Everyone registers once so they can request help in an emergency and help another person when they are able to donate.</p><div class="actions"><button class="btn success" onclick="go('register')">REGISTER NOW</button><button class="btn primary" onclick="go('login')">LOGIN</button></div></div>`;
 return `<div class="title"><h2>Emergency Blood Help</h2><span class="badge red">Emergency ready</span></div>
 <div class="card"><p class="small">Matching rule: <b>exact same blood group + available donor + same State + same District</b>.</p>
 <div class="formgrid"><div><label>Required blood group *</label><select id="fblood">${bloodOptions("B+")}</select></div>
 <div><label>Units required *</label><input id="funits" type="number" min="1" value="1"></div>
 <div><label>State *</label><select id="fstate" onchange="locationChanged('fstate','fdistrict',null,'state')"><option value="">All State</option>${states.map(x=>`<option value="${safe(x)}">${safe(x)}</option>`).join("")}</select></div>
 <div><label>District *</label><select id="fdistrict" onchange="locationChanged(\'fstate\',\'fdistrict\',null,\'district\')"><option value="">All District</option></select></div>
 
 <div><label>Required by</label><input id="fwhen" type="datetime-local"></div>
 <div><label>Emergency level</label><select id="flevel"><option>Critical</option><option>Urgent</option><option>Normal</option></select></div></div>
 <div class="actions"><button class="btn primary" onclick="searchDonors()">🔎 FIND MATCHING DONORS</button><button class="btn danger" onclick="go('emergency')">🚨 CREATE EMERGENCY REQUEST</button></div>
 <p class="small">Matching: exact blood group + available now + same State + same District.</p></div>`
}

window.searchDonors=async function(){
 if(!state.user)return toast("Please register/login first.");
 const req={blood:document.getElementById("fblood").value,units:+document.getElementById("funits").value,state:document.getElementById("fstate").value,district:document.getElementById("fdistrict").value,level:document.getElementById("flevel").value};
 if(!req.units||!req.state||!req.district)return toast("Please select blood group, state and district.");
 try{
  const q=query(collection(db,"users"),where("blood","==",req.blood),where("available","==",true),where("state","==",req.state),where("district","==",req.district));
  const snap=await getDocs(q);
  let donors=snap.docs.map(x=>({id:x.id,...x.data()}));
  donors=donors.map(d=>({...d,distance:estimateDistance(d,req)})).sort((a,b)=>score(b,req)-score(a,req));
  state.request=req;state.results=donors;state.page="results";render();
 }catch(e){toast("Could not load donor matches. Check Firebase setup/rules.")}
}

function estimateDistance(d,r){return d.district===r.district?12.5:d.state===r.state?55:180}
function score(d,r){return (d.district===r.district?100:0)+(d.state===r.state?20:0)-d.distance}
function results(){
 const r=state.request||{};const ds=state.results||[];
 return `<div class="title"><h2>Matching Donors</h2><span class="badge">${ds.length} available</span></div>
 <div class="card"><p><b>${safe(r.blood)}</b> • ${safe(r.units)} unit(s) • ${safe(r.district)}, ${safe(r.state)}</p><p class="small">Only exact blood-group matches are listed. Location only decides priority.</p></div>
 <div class="list">${ds.length?ds.map(d=>donorCard(d,r)).join(""):`<div class="card"><h3>No currently available ${safe(r.blood)} donor found</h3><p class="small">Try another location or create an emergency request so registered donors can respond.</p></div>`}</div>
 <div class="actions"><button class="btn danger" onclick="go('emergency')">🚨 CREATE EMERGENCY REQUEST</button><button class="btn outline" onclick="go('find')">CHANGE SEARCH</button></div>`
}
function donorCard(d,r){return `<div class="card donor"><div class="avatar">${safe((d.name||"?")[0])}</div><div class="grow"><b>${safe(d.name)}</b><div><span class="badge">${safe(d.blood)}</span> <span class="small">${safe(d.distance)} km approx.</span></div><div class="small">Available now • ${safe(d.district)}, ${safe(d.state)}</div></div><button class="btn success" onclick="sendRequest('${d.id}')">SEND REQUEST</button></div>`}

window.sendRequest=async function(donorId){
 if(!state.user)return toast("Please login first.");
 if(!state.request)return toast("Create a request first.");
 try{
  const donor=state.results.find(x=>x.id===donorId);
  const payload={requesterId:state.user.uid,requesterName:state.user.name,requesterMobile:state.user.mobile,donorId,donorName:donor.name,donorMobile:donor.mobile||"",blood:state.request.blood,units:state.request.units,state:state.request.state,district:state.request.district,level:state.request.level,status:"Sent",createdAt:serverTimestamp()};
  const ref=await addDoc(collection(db,"requests"),payload);state.request={...payload,id:ref.id};toast("Request sent to donor");go("requests");
 }catch(e){toast("Request could not be sent. Check Firebase rules.")}
}

function emergency(){if(!state.user)return `<div class="card"><h3>Registration required</h3><button class="btn success" onclick="go('register')">REGISTER</button></div>`;return `<div class="title"><h2>Emergency Blood Request</h2><span class="badge red">Critical</span></div>
<div class="card"><div class="formgrid"><div><label>Requester name</label><input id="ename" value="${safe(state.user.name)}"></div><div><label>Patient reference</label><input id="epatient" placeholder="Optional reference"></div>
<div><label>Blood group *</label><select id="eblood">${bloodOptions(state.user.blood)}</select></div><div><label>Units required *</label><input id="eunits" type="number" value="1" min="1"></div>
<div><label>State *</label><select id="estate" onchange="locationChanged(\'estate\',\'edistrict\',null,\'state\')"><option value="">All State</option>${states.map(x=>`<option value="${safe(x)}" ${x===state.user?.state?"selected":""}>${safe(x)}</option>`).join("")}</select></div>
<div><label>District *</label><select id="edistrict" onchange="locationChanged(\'estate\',\'edistrict\',null,\'district\')"><option value="">All District</option></select></div>

<div class="full"><label>Message</label><textarea id="emsg" rows="3" placeholder="Only useful non-sensitive information"></textarea></div></div>
<div class="actions"><button class="btn primary" onclick="createEmergency()">SUBMIT EMERGENCY REQUEST</button></div>
<p class="small">This sends the emergency request into the shared Firebase database. Matching donors can receive it on their own phone.</p></div>`}

window.createEmergency=async function(){
 if(!state.user)return toast("Please register/login first.");
 const g=id=>document.getElementById(id).value.trim();
 const blood=g("eblood"), units=+g("eunits"), stateName=g("estate"), district=g("edistrict");
 if(!blood||!units||!stateName||!district)return toast("Please complete blood group, state and district.");
 try{
  const q=query(collection(db,"users"),where("blood","==",blood),where("available","==",true),where("state","==",stateName),where("district","==",district));
  const snap=await getDocs(q);const donors=snap.docs.map(x=>({id:x.id,...x.data()}));
  const base={requesterId:state.user.uid,requesterName:g("ename"),requesterMobile:state.user.mobile,blood,units,state:g("estate"),district:g("edistrict"),level:"Critical",message:g("emsg"),status:"Open",createdAt:serverTimestamp()};
  // Create one request per matching donor so every eligible donor can see it live.
  if(!donors.length){await addDoc(collection(db,"requests"),base);toast("Emergency request published; no matching donor is currently available.");go("requests");return}
  for(const d of donors){await addDoc(collection(db,"requests"),{...base,donorId:d.id,donorName:d.name,donorMobile:d.mobile||"",status:"Sent"});}
  toast("Emergency request sent to matching donors");go("requests");
 }catch(e){toast("Emergency request failed. Check Firebase setup/rules.")}
}

function donor(){
 if(!state.user)return `<div class="title"><h2>Donor Dashboard</h2></div><div class="card"><h3>Account required</h3><button class="btn success" onclick="go('register')">REGISTER</button></div>`;
 return `<div class="title"><h2>Donor Dashboard</h2><span class="badge">${safe(state.user.blood)}</span></div>
 <div class="card"><h3>Hello, ${safe(state.user.name)}</h3><p><span class="badge">${safe(state.user.blood)}</span> <span class="badge ${state.user.available?"":"red"}">${state.user.available?"Available":"Unavailable"}</span></p>
 <div class="actions"><button class="btn outline" onclick="toggleAvailability()">${state.user.available?"🟢 AVAILABLE — TAP TO PAUSE":"⚪ PAUSED — TAP TO AVAILABLE"}</button><button class="btn outline" onclick="go('profile')">MY PROFILE</button></div></div>
 <div class="title"><h2>Incoming requests</h2><span class="badge blue">LIVE</span></div><div id="incoming"><div class="card"><p class="small">Loading live requests…</p></div></div>`;
}

async function listenDonorRequests(){
 if(unsubscribeRequests)unsubscribeRequests();
 if(!state.user||state.page!=="donor")return;
 const q=query(collection(db,"requests"),where("donorId","==",state.user.uid));
 unsubscribeRequests=onSnapshot(q,snap=>{
  const rows=snap.docs.map(x=>({id:x.id,...x.data()})).filter(x=>x.status==="Sent"||x.status==="Accepted").sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
  const el=document.getElementById("incoming"); if(!el)return;
  el.innerHTML=rows.length?rows.map(incomingCard).join(""):`<div class="card"><p class="small">No incoming requests right now.</p></div>`;
  if(rows.some(x=>x.status==="Sent"))toast("🔔 New blood request received");
 },e=>{const el=document.getElementById("incoming");if(el)el.innerHTML=`<div class="card"><p class="small">Live request feed could not load. Check Firestore rules.</p></div>`});
}
function incomingCard(r){return `<div class="card request urgent"><div class="badge red">${safe(r.level||"Emergency")}</div><h3>🩸 ${safe(r.blood)} — ${safe(r.units)} unit(s)</h3><p>${safe(r.district)}, ${safe(r.state)}</p><p class="small">Requester: ${safe(r.requesterName)}</p>${r.status==="Sent"?`<div class="actions"><button class="btn success" onclick="acceptRequest('${r.id}')">✅ ACCEPT</button><button class="btn danger" onclick="declineRequest('${r.id}')">DECLINE</button></div>`:`<div class="live"><b>Accepted.</b> Requester can now contact you.</div>`}</div>`}

window.acceptRequest=async function(id){try{const rs=await getDoc(doc(db,"requests",id));if(!rs.exists())return toast("Request not found");const r=rs.data();await updateDoc(doc(db,"requests",id),{status:"Accepted",acceptedAt:serverTimestamp()});await addDoc(collection(db,"connections"),{donorId:state.user.uid,donorName:state.user.name,donorMobile:state.user.mobile,receiverId:r.requesterId,receiverName:r.requesterName,receiverMobile:r.requesterMobile,blood:r.blood,district:r.district,state:r.state,createdAt:serverTimestamp()});toast("Request accepted — connection saved");go("requests")}catch(e){toast("Could not accept request.")}}
window.declineRequest=async function(id){try{await updateDoc(doc(db,"requests",id),{status:"Declined",declinedAt:serverTimestamp()});toast("Request declined")}catch(e){toast("Could not decline request.")}}
window.toggleAvailability=async function(){try{const next=!state.user.available;await updateDoc(doc(db,"users",state.user.uid),{available:next});state.user.available=next;toast(next?"You are available for requests":"Availability paused");render()}catch(e){toast("Could not update availability.")}}

async function listenRecipients(){if(!state.user||state.page!=="donor")return;const el=document.getElementById("recipients");if(!el)return;try{const q=query(collection(db,"users"),where("blood","==",state.user.blood),where("state","==",state.user.state),where("district","==",state.user.district));const snap=await getDocs(q);const rows=snap.docs.map(x=>({id:x.id,...x.data()})).filter(x=>x.id!==state.user.uid).map(x=>({...x,distance:estimateDistance(x,{state:state.user.state,district:state.user.district})})).sort((a,b)=>score(b,{state:state.user.state,district:state.user.district})-score(a,{state:state.user.state,district:state.user.district}));el.innerHTML=rows.length?rows.map(recipientCard).join(""):`<div class="card"><p class="small">No same-blood recipients in your state yet.</p></div>`}catch(e){el.innerHTML=`<div class="card"><p class="small">Recipient matching could not load.</p></div>`}}
function recipientCard(r){const m=normalizeMobile(r.mobile);return `<div class="card donor"><div class="avatar">${safe((r.name||"?")[0])}</div><div class="grow"><b>${safe(r.name)}</b><div><span class="badge">${safe(r.blood)}</span> <span class="small">${safe(r.district)}</span></div></div><div class="actions" style="margin-top:0"><a class="btn success" href="tel:${m}" style="text-decoration:none">📞 CALL</a><a class="btn blue" target="_blank" href="https://wa.me/${m}?text=${encodeURIComponent("Hello "+(r.name||"")+", I am an available JeevanSetu donor. I can help with your blood group request. Please coordinate with the requester and local emergency services.")}" style="text-decoration:none">💬 CHAT</a></div></div>`}
function requests(){if(!state.user)return `<div class="card"><p>Please login first.</p></div>`;return `<div class="title"><h2>My Requests</h2><span class="badge blue">LIVE</span></div><div id="myrequests"><div class="card"><p class="small">Loading…</p></div></div>`}
async function listenMyRequests(){
 const el=document.getElementById("myrequests");if(!el||!state.user)return;
 const q=query(collection(db,"requests"),where("requesterId","==",state.user.uid));
 onSnapshot(q,snap=>{
  const rows=snap.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
  el.innerHTML=rows.length?rows.map(requestCard).join(""):`<div class="card"><p class="small">No requests yet.</p></div>`;
 },()=>{el.innerHTML=`<div class="card"><p class="small">Could not load requests.</p></div>`});
}
function requestCard(r){return `<div class="card request"><div class="badge ${r.status==="Accepted"?"":"red"}">${safe(r.status||"Open")}</div><h3>${safe(r.blood)} • ${safe(r.units)} unit(s)</h3><p>${safe(r.district)}, ${safe(r.state)}</p><p class="small">Donor: ${safe(r.donorName||"Waiting for a matching donor")}</p><button class="btn outline" onclick="showRequest(${JSON.stringify(r).replace(/"/g,'&quot;')})">VIEW</button></div>`}
window.showRequest=function(r){state.request=r;go("requestdetail")}

function requestdetail(){const r=state.request;if(!r)return `<div class="card">No request.</div>`;const accepted=r.status==="Accepted";const mobile=normalizeMobile(r.donorMobile);return `<div class="title"><h2>Request Details</h2><span class="badge ${accepted?"":"red"}">${safe(r.status)}</span></div>
<div class="card"><p><b>Blood:</b> ${safe(r.blood)}</p><p><b>Units:</b> ${safe(r.units)}</p><p><b>Location:</b> ${safe(r.district)}, ${safe(r.state)}</p><p><b>Donor:</b> ${safe(r.donorName||"Waiting")}</p>
${accepted&&mobile?`<div class="live"><h3>✅ Donor accepted</h3><p class="small">Contact is available after acceptance.</p><div class="actions"><a class="btn success" href="tel:${mobile}" style="text-decoration:none">📞 CALL DONOR</a><a class="btn blue" target="_blank" rel="noopener" href="https://wa.me/${mobile}?text=${encodeURIComponent("Hello "+(r.donorName||"Donor")+", your JeevanSetu blood request has been accepted. Please coordinate with the requester and local emergency services.")}" style="text-decoration:none">💬 WHATSAPP</a></div></div>`:""}</div><button class="btn outline" onclick="go('requests')">BACK</button>`}

function profile(){return state.user?`<div class="title"><h2>My Profile</h2></div><div class="card"><div class="grid"><div><p class="small">Name</p><b>${safe(state.user.name)}</b></div><div><p class="small">Blood group</p><b>${safe(state.user.blood)}</b></div><div><p class="small">Mobile</p><b>${safe(state.user.mobile)}</b></div><div><p class="small">Location</p><b>${safe(state.user.district)}, ${safe(state.user.state)}</b></div></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><p class="small">One account is used for both requesting blood and helping as an available donor.</p><div class="actions"><button class="btn outline" onclick="toggleRole()">🔄 SWITCH TO ${state.user.activeRole==="donor"?"RECEIVER":"DONOR"}</button><button class="btn outline" onclick="go('donor')">DONOR DASHBOARD</button><button class="btn outline" onclick="go('connections')">MY CONNECTIONS</button><button class="btn danger" onclick="logoutUser()">LOG OUT</button></div></div>`:`<div class="title"><h2>Account</h2></div><div class="card"><p>Register once for the JeevanSetu community network.</p><div class="actions"><button class="btn success" onclick="go('register')">REGISTER</button><button class="btn primary" onclick="go('login')">LOGIN</button></div></div>`}

window.logoutUser=async function(){try{await signOut(auth);state.user=null;state.request=null;if(unsubscribeRequests)unsubscribeRequests();toast("Logged out");go("home")}catch(e){toast("Logout failed")}}

function connections(){if(!state.user)return `<div class="card"><p>Please login first.</p></div>`;return `<div class="title"><h2>My Connections</h2><span class="badge blue">SAVED</span></div><div id="connectionsList"><div class="card"><p class="small">Loading connections…</p></div></div>`}
async function listenConnections(){const el=document.getElementById("connectionsList");if(!el||!state.user)return;try{const q1=query(collection(db,"connections"),where("donorId","==",state.user.uid));const q2=query(collection(db,"connections"),where("receiverId","==",state.user.uid));const [a,b]=await Promise.all([getDocs(q1),getDocs(q2)]);const rows=[...a.docs,...b.docs].map(x=>({id:x.id,...x.data()})).sort((x,y)=>(y.createdAt?.seconds||0)-(x.createdAt?.seconds||0));el.innerHTML=rows.length?rows.map(c=>{const other=c.donorId===state.user.uid?{name:c.receiverName,mobile:c.receiverMobile}: {name:c.donorName,mobile:c.donorMobile};const m=normalizeMobile(other.mobile);return `<div class="card"><h3>🤝 ${safe(other.name)}</h3><p class="small">${safe(c.blood)} • ${safe(c.district)}, ${safe(c.state)}</p><div class="actions"><a class="btn success" href="tel:${m}" style="text-decoration:none">📞 CALL</a><a class="btn blue" target="_blank" href="https://wa.me/${m}?text=${encodeURIComponent("Hello "+other.name+", this is our JeevanSetu connection.")}" style="text-decoration:none">💬 WHATSAPP</a></div></div>`}).join(""):`<div class="card"><p class="small">No accepted connections yet.</p></div>`}catch(e){el.innerHTML=`<div class="card"><p class="small">Connections could not load. If Firestore rules do not include connections, add the supplied rules file.</p></div>`}}
window.toggleRole=async function(){try{const next=state.user.activeRole==="donor"?"receiver":"donor";await updateDoc(doc(db,"users",state.user.uid),{activeRole:next});state.user.activeRole=next;toast("Dashboard switched to "+next.toUpperCase());render()}catch(e){toast("Could not switch role.")}}
function permissionState(name){
 try{
  if(name==='geolocation' && navigator.permissions?.query) return navigator.permissions.query({name:'geolocation'});
  if(name==='notifications' && navigator.permissions?.query) return navigator.permissions.query({name:'notifications'});
  if(name==='camera' && navigator.permissions?.query) return navigator.permissions.query({name:'camera'});
 }catch(e){}
 return Promise.resolve({state:'unknown'});
}
async function getPermissionStatuses(){
 const out={location:'unsupported',notifications:'unsupported',camera:'unsupported'};
 if('geolocation' in navigator) out.location=(await permissionState('geolocation')).state||'unknown';
 if('Notification' in window) out.notifications=Notification.permission;
 if('mediaDevices' in navigator && 'getUserMedia' in navigator.mediaDevices) out.camera=(await permissionState('camera')).state||'unknown';
 return out;
}
function permissionLabel(v){return v==='granted'?'Allowed':v==='denied'?'Denied':v==='prompt'?'Not decided':v==='unsupported'?'Not supported':'Unknown'}
async function refreshPermissionStatus(){
 const s=await getPermissionStatuses();
 for(const [k,v] of Object.entries(s)){const el=document.getElementById('perm-'+k);if(el){el.textContent=permissionLabel(v);el.className='state '+(v==='granted'?'ok':v==='denied'?'bad':'');}}
}
function permissions(){return `<div class="title"><h2>Device Permissions Required</h2><span class="badge red">REQUIRED</span></div>
<div class="card"><p><b>JeevanSetu cannot continue until all three permissions are Allowed.</b></p>
<div class="permission"><div><b>📍 Location</b><div class="small">Required for device/location permission setup.</div></div><div><span id="perm-location" class="state">Checking…</span><button class="btn outline" onclick="requestLocation()">ALLOW</button></div></div>
<div class="permission"><div><b>🔔 Notifications</b><div class="small">Required for emergency alerts on this device.</div></div><div><span id="perm-notifications" class="state">Checking…</span><button class="btn outline" onclick="requestNotifications()">ALLOW</button></div></div>
<div class="permission"><div><b>📷 Camera</b><div class="small">Required for the app's QR scanning feature.</div></div><div><span id="perm-camera" class="state">Checking…</span><button class="btn outline" onclick="requestCameraPermission()">ALLOW</button></div></div>
<p id="permissionMessage" class="small">Tap ALLOW for each permission. If you press Deny, JeevanSetu will not move ahead.</p></div>
<div class="actions"><button class="btn primary" onclick="checkAndContinue()">✓ CHECK & CONTINUE</button></div>`}
window.checkAndContinue=async function(){const s=await getPermissionStatuses();const all=s.location==='granted'&&s.notifications==='granted'&&s.camera==='granted';if(all){state.permissionsGranted=true;state.page='home';appShell();if(!configured){setupScreen()}else{startListeners()}}else{state.permissionsGranted=false;const denied=Object.entries(s).filter(([k,v])=>v==='denied').map(([k])=>k);const pending=Object.entries(s).filter(([k,v])=>v!=='granted').map(([k])=>k);const msg=denied.length?`Denied: ${denied.join(', ')}. Change the permission to Allow in browser/site settings, then return and check again.`:`Please Allow all permissions first. Still pending: ${pending.join(', ')}.`;const el=document.getElementById('permissionMessage');if(el)el.textContent=msg;toast(msg)}refreshPermissionStatus()}
window.requestLocation=function(){if(!navigator.geolocation){toast('Location permission is not supported on this browser.');return}navigator.geolocation.getCurrentPosition(()=>{toast('Location Allowed.');refreshPermissionStatus()},()=>{toast('Location Denied. You cannot continue until Location is Allowed.');refreshPermissionStatus()},{enableHighAccuracy:false,timeout:10000,maximumAge:0})}
window.requestNotifications=async function(){if(!('Notification' in window)){toast('Notifications are not supported in this browser. Use a supported browser/device.');return}try{const r=await Notification.requestPermission();toast(r==='granted'?'Notifications Allowed.':r==='denied'?'Notifications Denied. You cannot continue until it is Allowed.':'Please choose Allow.');refreshPermissionStatus()}catch(e){toast('Notification permission request failed.');refreshPermissionStatus()}}
window.requestCameraPermission=async function(){if(!navigator.mediaDevices?.getUserMedia){toast('Camera permission is not supported in this browser.');return}let stream;try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});stream.getTracks().forEach(t=>t.stop());toast('Camera Allowed.');refreshPermissionStatus()}catch(e){toast(e.name==='NotAllowedError'?'Camera Denied. You cannot continue until Camera is Allowed.':'Camera permission unavailable.');refreshPermissionStatus()}}
function scan(){return `<div class="title"><h2>QR Scanner</h2><span class="badge">Optional</span></div><div class="card"><p class="small">Allow camera access only if you want to scan a QR code. The camera is stopped as soon as scanning is closed.</p><video id="qrVideo" class="videoBox" autoplay playsinline muted></video><div id="scanStatus" class="small">Camera is off.</div><div class="actions"><button class="btn primary" onclick="startQRScan()">📷 START SCAN</button><button class="btn outline" onclick="stopQRScan()">STOP</button><button id="scanContinue" class="btn success hidden" onclick="go('home')">✓ CONTINUE TO APP</button></div></div><div class="actions"><button class="btn outline" onclick="go('home')">BACK</button></div>`}
let qrStream=null,qrTimer=null;
window.startQRScan=async function(){const video=document.getElementById('qrVideo'),status=document.getElementById('scanStatus');if(!video)return;try{qrStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});video.srcObject=qrStream;status.textContent='Camera allowed. Point it at a QR code.';if('BarcodeDetector' in window){const detector=new BarcodeDetector({formats:['qr_code']});qrTimer=setInterval(async()=>{try{const codes=await detector.detect(video);if(codes[0]?.rawValue){const u=codes[0].rawValue;stopQRScan();status.textContent='QR detected: '+u;if(/^https?:\/\//i.test(u)) location.href=u;else toast('QR detected.');}}catch(e){}},700)}else status.textContent='Camera allowed, but this browser does not support built-in QR decoding. Use your phone camera/QR app.'}catch(e){status.textContent=e.name==='NotAllowedError'?'Camera permission denied. QR scanning is skipped; you can continue using JeevanSetu.':'Camera unavailable. QR scanning is optional.';toast(status.textContent);setTimeout(()=>{const b=document.getElementById('scanContinue');if(b)b.classList.remove('hidden')},0)}}
window.stopQRScan=function(){if(qrTimer){clearInterval(qrTimer);qrTimer=null}if(qrStream){qrStream.getTracks().forEach(t=>t.stop());qrStream=null}const v=document.getElementById('qrVideo');if(v)v.srcObject=null}
function about(){return `<div class="title"><h2>About JeevanSetu</h2></div><div class="card"><h3>Purpose</h3><p>JeevanSetu is a college prototype for connecting registered citizens with matching blood-group donors during emergencies.</p><p class="small">It is not a blood bank and does not replace medical verification or advice.</p></div>`}

function setupScreen(){document.getElementById("app").innerHTML=`<main class="wrap"><section class="hero"><div class="badge red">One-time setup</div><h1>Connect JeevanSetu to Firebase</h1><p>Live two-phone requests need a shared online database. Add your Firebase web configuration in <b>firebase-config.js</b>, then refresh this page.</p><div class="notice"><b>Do not paste passwords or private patient data into Firebase config.</b> The web config itself is okay to be present in a frontend; Firestore Security Rules control database access.</div><div class="actions"><a class="btn primary" href="https://console.firebase.google.com/" target="_blank">OPEN FIREBASE CONSOLE</a></div></section></main>`}

function startListeners(){
 onAuthStateChanged(auth,async u=>{
  if(!u){state.user=null;render();return}
  const snap=await getDoc(doc(db,"users",u.uid));
  if(snap.exists()){state.user={uid:u.uid,...snap.data()};}
  render();
 });
}

function permissionGate(){state.permissionsGranted=false;appShell();state.page="permissions";render()}
if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});
permissionGate();
setInterval(()=>{if(state.page==="donor"){listenDonorRequests();listenRecipients()}if(state.page==="requests")listenMyRequests();if(state.page==="connections")listenConnections()},1800);
window.loadDistrict=loadDistrict;
window.locationChanged=locationChanged;
</script>
